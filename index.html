<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paisa – Personal Wealth Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#EAF0F5;--surface:#fff;--ink:#12263A;--muted:#5B6B7B;--line:#D5DEE7;--accent:#0F766E;--accent-ink:#fff;--gain:#15803D;--loss:#B42318;--gold:#C98A00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A26;--surface:#162636;--ink:#E7EEF5;--muted:#93A4B5;--line:#273B4F;--accent:#2DD4BF;--accent-ink:#06201D;--gain:#4ADE80;--loss:#F87171;--gold:#F5B83D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A26;--surface:#162636;--ink:#E7EEF5;--muted:#93A4B5;--line:#273B4F;--accent:#2DD4BF;--accent-ink:#06201D;--gain:#4ADE80;--loss:#F87171;--gold:#F5B83D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{padding:24px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{font:800 26px "Bricolage Grotesque",sans-serif;padding:0 10px 18px;letter-spacing:-.03em}
.brand span{color:var(--accent)}
nav a{padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav .sp{flex:1}
main{padding:28px;max-width:1100px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
.top h2{font-size:28px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:26px;margin-bottom:18px}
.hero small{opacity:.7}
.hero .big{font:800 clamp(38px,8vw,64px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:4px 0 18px}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.15)}
.split i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{font-size:18px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--muted);font-size:13px}
.gain{color:var(--gain)}.loss{color:var(--loss)}
.chartbox{position:relative;height:260px}
form.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:500}
td.amt{text-align:right;font-weight:600;white-space:nowrap}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--loss)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.insight{border-left:4px solid var(--gold);padding:10px 14px;background:var(--surface);border-radius:0 8px 8px 0;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.toolbar input{flex:1;min-width:140px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:800px){.app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding:0 8px 0 0;align-self:center}nav .sp{display:none}main{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="brand">paisa<span>.</span></div>
  <a href="#dashboard" data-v="dashboard">Dashboard</a>
  <a href="#transactions" data-v="transactions">Transactions</a>
  <a href="#budgets" data-v="budgets">Budgets</a>
  <a href="#goals" data-v="goals">Savings goals</a>
  <div class="sp"></div>
  <button class="ghost sm" id="theme">Switch theme</button>
</nav>
<main>
  <div class="top"><h2 id="title"></h2>
    <label style="display:flex;align-items:center;gap:8px">Month <select id="month"></select></label></div>
  <div id="view"></div>
</main>
</div>
<div id="toast" role="status"></div>
<script>
var EXP=["Food","Rent","Travel","Shopping","Bills","Education","Health","Other"],
    INC=["Pocket money","Salary","Freelance","Investments","Other"],
    COL=["#0F766E","#C98A00","#2563EB","#B42318","#7C3AED","#0891B2","#65A30D","#DB2777"],
    KEY="paisa-v1",S={tx:[],budgets:{},goals:[]},month="",charts=[];
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function inr(n){return"₹"+Math.round(n).toLocaleString("en-IN")}
function toast(m){var t=$("#toast");t.textContent=m;t.className="show";setTimeout(function(){t.className=""},1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function mlabel(m){if(m==="all")return"All time";var d=new Date(m+"-01T00:00");return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function inMonth(t){return month==="all"||t.date.slice(0,7)===month}
function sum(a){return a.reduce(function(s,t){return s+t.amount},0)}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function months(){var set={};set[today().slice(0,7)]=1;S.tx.forEach(function(t){set[t.date.slice(0,7)]=1});return Object.keys(set).sort().reverse()}
function fillMonths(){var o='<option value="all">All time</option>'+months().map(function(m){return'<option value="'+m+'">'+mlabel(m)+'</option>'}).join("");var s=$("#month");s.innerHTML=o;if(!month)month=today().slice(0,7);if(!months().includes(month)&&month!=="all")month=today().slice(0,7);s.value=month}
function opts(a,sel){return a.map(function(c){return'<option'+(c===sel?" selected":"")+'>'+c+'</option>'}).join("")}
function killCharts(){charts.forEach(function(c){c.destroy()});charts=[]}

function dashboard(){
  var all=S.tx,cur=all.filter(inMonth),inc=sum(cur.filter(function(t){return t.type==="income"})),ex=sum(cur.filter(function(t){return t.type==="expense"}));
  var bal=sum(all.filter(function(t){return t.type==="income"}))-sum(all.filter(function(t){return t.type==="expense"}));
  var rate=inc>0?Math.round((inc-ex)/inc*100):0,tot=inc+ex||1;
  var byCat={};cur.filter(function(t){return t.type==="expense"}).forEach(function(t){byCat[t.category]=(byCat[t.category]||0)+t.amount});
  var top=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]})[0];
  var msg=!all.length?"No data yet. Add your first transaction, or load sample data to see how the dashboard works.":
    top?"Most of your spending in "+mlabel(month)+" went to "+top+" ("+inr(byCat[top])+"). "+(rate>=20?"You are saving "+rate+"% of income, which is healthy.":inc>0?"You are saving "+rate+"% of income. Aim for at least 20%.":"No income recorded for this period."):"No expenses recorded for this period.";
  $("#view").innerHTML='<div class="hero"><small>Total balance (all time)</small><div class="big">'+inr(bal)+'</div>'+
   '<div class="split"><i style="width:'+inc/tot*100+'%;background:#4ADE80"></i><i style="width:'+ex/tot*100+'%;background:#F87171"></i></div>'+
   '<div class="legend"><span>Income '+inr(inc)+'</span><span>Expenses '+inr(ex)+'</span></div></div>'+
   '<div class="insight">'+msg+'</div>'+
   '<div class="stats"><div class="stat"><span>Income</span><b class="gain">'+inr(inc)+'</b></div><div class="stat"><span>Expenses</span><b class="loss">'+inr(ex)+'</b></div><div class="stat"><span>Saved</span><b>'+inr(inc-ex)+'</b></div><div class="stat"><span>Savings rate</span><b>'+rate+'%</b></div></div>'+
   '<div class="grid"><div class="card"><h3>Spending by category</h3><div class="chartbox"><canvas id="c1"></canvas></div></div><div class="card"><h3>Last 6 months</h3><div class="chartbox"><canvas id="c2"></canvas></div></div></div>'+
   (all.length?"":'<p><button id="demo">Load sample data</button></p>');
  var d=$("#demo");if(d)d.onclick=demo;
  if(typeof Chart==="undefined")return;
  var ink=cssv("--muted"),line=cssv("--line");Chart.defaults.color=ink;Chart.defaults.font.family="IBM Plex Sans";
  var keys=Object.keys(byCat);
  if(keys.length)charts.push(new Chart($("#c1"),{type:"doughnut",data:{labels:keys,datasets:[{data:keys.map(function(k){return byCat[k]}),backgroundColor:COL,borderColor:cssv("--surface")}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"right"}}}}));
  var ms=[],n=new Date();for(var i=5;i>=0;i--){var x=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}
  function mt(m,ty){return sum(all.filter(function(t){return t.type===ty&&t.date.slice(0,7)===m}))}
  charts.push(new Chart($("#c2"),{type:"bar",data:{labels:ms.map(function(m){return new Date(m+"-01T00:00").toLocaleDateString("en-IN",{month:"short"})}),datasets:[{label:"Income",data:ms.map(function(m){return mt(m,"income")}),backgroundColor:cssv("--gain")},{label:"Expenses",data:ms.map(function(m){return mt(m,"expense")}),backgroundColor:cssv("--loss")}]},options:{maintainAspectRatio:false,scales:{y:{grid:{color:line}},x:{grid:{display:false}}}}}));
}

var filt={q:"",ty:"all"};
function transactions(){
  var h='<div class="card" style="margin-bottom:16px"><h3>Add transaction</h3><form class="row" id="f"><label>Type<select id="ty"><option value="expense">Expense</option><option value="income">Income</option></select></label>'+
   '<label>Amount (₹)<input id="am" type="number" min="1" step="1" required></label><label>Category<select id="ca">'+opts(EXP)+'</select></label>'+
   '<label>Date<input id="dt" type="date" value="'+today()+'" required></label><label>Note<input id="no" maxlength="60" placeholder="Optional"></label><button>Add</button></form></div>'+
   '<div class="card"><div class="toolbar"><input id="q" placeholder="Search notes or category" value="'+esc(filt.q)+'"><select id="ft"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select><button class="ghost" id="csv">Copy as CSV</button></div><div class="tw" id="list"></div></div>';
  $("#view").innerHTML=h;$("#ft").value=filt.ty;
  $("#ty").onchange=function(){$("#ca").innerHTML=opts(this.value==="income"?INC:EXP)};
  $("#f").onsubmit=function(e){e.preventDefault();var a=Number($("#am").value);if(!(a>0))return toast("Enter an amount above 0");
    S.tx.push({id:uid(),type:$("#ty").value,amount:a,category:$("#ca").value,date:$("#dt").value,note:$("#no").value.trim()});save();fillMonths();toast("Transaction added");transactions()};
  $("#q").oninput=function(){filt.q=this.value;rows()};$("#ft").onchange=function(){filt.ty=this.value;rows()};
  $("#csv").onclick=function(){var c="date,type,category,amount,note\n"+S.tx.map(function(t){return[t.date,t.type,t.category,t.amount,'"'+t.note.replace(/"/g,'""')+'"'].join(",")}).join("\n");
    try{navigator.clipboard.writeText(c).then(function(){toast("CSV copied to clipboard")},function(){toast("Clipboard blocked by browser")})}catch(e){toast("Clipboard unavailable")}};
  rows();
}
function rows(){
  var q=filt.q.toLowerCase(),l=S.tx.filter(function(t){return inMonth(t)&&(filt.ty==="all"||t.type===filt.ty)&&(t.note+" "+t.category).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.date.localeCompare(a.date)});
  $("#list").innerHTML=l.length?'<table><tr><th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr>'+l.map(function(t){
    return'<tr><td>'+t.date+'</td><td>'+esc(t.category)+'</td><td class="muted">'+esc(t.note)+'</td><td class="amt '+(t.type==="income"?"gain":"loss")+'">'+(t.type==="income"?"+":"−")+inr(t.amount)+'</td><td><button class="ghost sm" data-d="'+t.id+'">Delete</button></td></tr>'}).join("")+'</table>':'<div class="empty">No transactions match. Add one above or change the month filter.</div>';
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.tx=S.tx.filter(function(t){return t.id!==b.dataset.d});save();fillMonths();rows();toast("Transaction deleted")}});
}

function budgets(){
  var cur=S.tx.filter(function(t){return inMonth(t)&&t.type==="expense"}),sp={};cur.forEach(function(t){sp[t.category]=(sp[t.category]||0)+t.amount});
  var ks=Object.keys(S.budgets);
  $("#view").innerHTML='<div class="grid"><div class="card"><h3>Set a monthly budget</h3><form class="row" id="bf"><label>Category<select id="bc">'+opts(EXP)+'</select></label><label>Limit (₹)<input id="bl" type="number" min="1" required></label><button>Save budget</button></form><p class="muted">Budgets compare against spending in the selected month.</p></div>'+
  '<div class="card"><h3>Budget progress</h3>'+(ks.length?ks.map(function(k){var l=S.budgets[k],s=sp[k]||0,p=s/l*100;
    return'<div class="item"><div class="h"><span>'+esc(k)+'</span><span class="'+(p>100?"loss":"")+'">'+inr(s)+' / '+inr(l)+'</span></div><div class="bar"><i class="'+(p>100?"over":"")+'" style="width:'+Math.min(p,100)+'%"></i></div><small class="muted">'+(p>100?"Over by "+inr(s-l):inr(l-s)+" left")+' · <a href="#budgets" data-r="'+esc(k)+'">remove</a></small></div>'}).join(""):'<div class="empty">No budgets yet. Pick a category and set a limit.</div>')+'</div></div>';
  $("#bf").onsubmit=function(e){e.preventDefault();S.budgets[$("#bc").value]=Number($("#bl").value);save();toast("Budget saved");budgets()};
  document.querySelectorAll("[data-r]").forEach(function(a){a.onclick=function(e){e.preventDefault();delete S.budgets[a.dataset.r];save();budgets()}});
}

function goals(){
  $("#view").innerHTML='<div class="grid"><div class="card"><h3>New savings goal</h3><form class="row" id="gf"><label>Goal<input id="gn" maxlength="40" placeholder="e.g. New laptop" required></label><label>Target (₹)<input id="gt" type="number" min="1" required></label><button>Create goal</button></form></div>'+
  '<div class="card"><h3>Your goals</h3>'+(S.goals.length?S.goals.map(function(g){var p=Math.min(g.saved/g.target*100,100);
    return'<div class="item"><div class="h"><span>'+esc(g.name)+'</span><span>'+Math.round(p)+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="muted">'+inr(g.saved)+' of '+inr(g.target)+(p>=100?" · Goal reached":"")+'</div>'+
    '<div class="toolbar" style="margin:8px 0 0"><input type="number" min="1" placeholder="Add ₹" id="a'+g.id+'"><button class="sm" data-a="'+g.id+'">Add savings</button><button class="ghost sm" data-x="'+g.id+'">Delete</button></div></div>'}).join(""):'<div class="empty">No goals yet. Create one to start tracking.</div>')+'</div></div>';
  $("#gf").onsubmit=function(e){e.preventDefault();S.goals.push({id:uid(),name:$("#gn").value.trim(),target:Number($("#gt").value),saved:0});save();toast("Goal created");goals()};
  document.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var v=Number($("#a"+b.dataset.a).value);if(!(v>0))return toast("Enter an amount above 0");S.goals.forEach(function(g){if(g.id===b.dataset.a)g.saved+=v});save();toast("Savings added");goals()}});
  document.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){S.goals=S.goals.filter(function(g){return g.id!==b.dataset.x});save();goals()}});
}

function demo(){
  var n=new Date(),t=[];
  for(var i=0;i<4;i++){var d=new Date(n.getFullYear(),n.getMonth()-i,1),m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    t.push(["income","Pocket money",12000,"05","Monthly allowance"],["income","Freelance",3000+i*1500,"15","Web project"],["expense","Rent",4500,"02","Hostel fees"],["expense","Food",2200+i*300,"10","Mess and snacks"],["expense","Travel",900,"12","Metro and bus"],["expense","Shopping",1500+i*400,"18","Clothes"],["expense","Education",1200,"20","Courses and books"],["expense","Bills",650,"22","Phone recharge"])}
  S.tx=t.map(function(a){var d=new Date(n.getFullYear(),n.getMonth(),1);return null}).filter(Boolean);
  S.tx=[];for(var i=0;i<4;i++){var d2=new Date(n.getFullYear(),n.getMonth()-i,1),mm=d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0");
    t.slice(i*8,i*8+8).forEach(function(a){S.tx.push({id:uid(),type:a[0],category:a[1],amount:a[2],date:mm+"-"+a[3],note:a[4]})})}
  S.budgets={Food:3000,Shopping:2000,Travel:1000};S.goals=[{id:uid(),name:"New laptop",target:60000,saved:18000}];
  save();fillMonths();toast("Sample data loaded");render();
}

var V={dashboard:["Dashboard",dashboard],transactions:["Transactions",transactions],budgets:["Budgets",budgets],goals:["Savings goals",goals]};
function render(){
  killCharts();var v=location.hash.slice(1);if(!V[v])v="dashboard";
  $("#title").textContent=V[v][0];
  document.querySelectorAll("nav a").forEach(function(a){a.className=a.dataset.v===v?"on":""});
  $("#month").parentNode.style.visibility=v==="goals"?"hidden":"visible";
  V[v][1]();
}
$("#month").onchange=function(){month=this.value;render()};
$("#theme").onclick=function(){var r=document.documentElement,dark=cssv("color-scheme")==="dark"||r.dataset.theme==="dark"&&false;
  var isDark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0E1A26";r.dataset.theme=isDark?"light":"dark";render()};
window.addEventListener("hashchange",render);
fillMonths();render();
</script>
</body>
</html>
